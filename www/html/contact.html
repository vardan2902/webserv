<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/style.css">

<body>
  <nav>
    <a href="/">Home</a>

    <a href="/cgi-bin/hello.py">CGI Hello</a>

    <a href="/cgi-bin/post.py">CGI POST</a>
  </nav>
  <main>
    <h1>Contact</h1>
    <p>Submit a message via the CGI POST handler below.</p>
    <form method="POST" action="/cgi-bin/post.py">
      <label>Name<br><input type="text" name="name" placeholder="Your name"></label><br><br>
      <label>Message<br><textarea name="message" rows="4" cols="40"></textarea></label><br><br>
      <input type="submit" value="Send">
    </form>
  </main>
</body>
