server {
    listen 127.0.0.1:8080;
    root /var/www/html;

    location / {
        root /var/www/html;
        index index.html;
        allow_methods GET;
    }
}

server {
    listen 0.0.0.0:8081;
    root /var/www/html;

    location / {
        root /var/www/html;
        index index.html;
        allow_methods GET;
    }
}
