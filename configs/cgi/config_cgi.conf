server {
    listen 8080;
    root /home/sp1tak/webserv/www;
    client_max_body_size 1m;

    location / {
        root /home/sp1tak/webserv/www;
        index index.html;
        allow_methods GET;
    }

    location /cgi-bin {
        root /home/sp1tak/webserv/www;
        allow_methods GET POST;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .php /usr/bin/php-cgi;
    }

    location /files {
        root /home/sp1tak/webserv/www;
        autoindex on;
        allow_methods GET DELETE;
    }

    location /upload {
        root /home/sp1tak/webserv/www;
        allow_methods POST;
        upload_store /home/sp1tak/webserv/www/uploads;
    }
}
