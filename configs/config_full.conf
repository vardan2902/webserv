server {
    listen 8080;
    root /var/www/html;
    client_max_body_size 10m;
    error_page 404 /404.html;
    error_page 500 /50x.html;

    location / {
        root /var/www/html;
        index index.html;
        allow_methods GET;
    }

    location /files {
        root /var/www/html;
        autoindex on;
        allow_methods GET DELETE;
    }

    location /old {
        root /var/www/html;
        return 301 http://localhost:8080/;
    }
}
